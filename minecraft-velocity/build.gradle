dependencies {
    implementation project(":core")

    compileOnly "com.velocitypowered:velocity-api:$velocity_version"

    annotationProcessor "com.velocitypowered:velocity-api:$velocity_version"
}

tasks.named("buildFinalJar", Jar) {
    from(zipTree(tasks.shadeDowngradedApi.archiveFile))

    dependsOn tasks.shadeDowngradedApi
}

shadowJar {
        relocate("net.flectone.pulse.library.guice", "com.google.inject")
        relocate("net.flectone.pulse.library.guava", "com.google.common")

        outputs.cacheIf { true }

        minimize()
}
