plugins {
    id "java"
    id "java-library"
    id "com.gradleup.shadow" version "9.6.1"
    id "xyz.wagyourtail.jvmdowngrader" version "2.0.1"
    id "io.freefair.lombok" version "9.8.2"
    id "com.github.gmazzo.buildconfig" version "6.1.2" apply false
    id "com.vanniktech.maven.publish" version "0.37.0" apply false
}

group = maven_group
version = project_version

repositories {
    mavenCentral()
}

subprojects {
    apply plugin: "java"
    apply plugin: "java-library"
    apply plugin: "com.gradleup.shadow"
    apply plugin: "xyz.wagyourtail.jvmdowngrader"
    apply plugin: "io.freefair.lombok"
    apply from: "$rootDir/gradle/libraries.gradle"

    java {
        sourceCompatibility = java_version
        targetCompatibility = java_version
    }

    configurations.configureEach {
        resolutionStrategy {
            force "com.google.code.gson:gson:$gson_version"
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = "UTF-8"
    }

    tasks.withType(Javadoc).configureEach {
        options.addStringOption("Xdoclint:none", "-quiet")
        options.addStringOption("encoding", "UTF-8")
        options.addStringOption("charSet", "UTF-8")
    }

    repositories {
        mavenCentral()

        maven {
            url = "https://repo.papermc.io/repository/maven-public/"
            content {
                includeGroup "io.papermc.paper"
                includeGroup "com.velocitypowered"
                includeGroup "net.md-5"
            }
        }
        maven {
            url = "https://hub.spigotmc.org/nexus/content/repositories/snapshots/"
            content {
                includeGroup "org.spigotmc"
            }
        }
        maven {
            url = "https://libraries.minecraft.net"
            content {
                includeGroup "com.mojang"
            }
        }
        maven {
            url = "https://repo.codemc.io/repository/maven-releases/"
            content {
                includeGroup "net.skinsrestorer"
                includeGroup "org.bstats"
            }
        }
        maven {
            url = "https://repo.codemc.io/repository/ArikSquad/"
            content {
                includeGroup "eu.mikart.adventure"
            }
        }
        maven {
            url = "https://repo.helpch.at/releases/"
            content {
                includeGroup "me.clip"
                includeGroup "at.helpch"
            }
        }
        maven {
            url = "https://maven.maxhenkel.de/repository/public"
            content {
                includeGroup "de.maxhenkel.voicechat"
            }
        }
        maven {
            url = "https://repo.plasmoverse.com/releases"
            content {
                includeGroupAndSubgroups "su.plo"
            }
        }
        maven {
            url = "https://repo.loohpjames.com/repository"
            content {
                includeGroup "com.loohp"
                includeGroup "dev.lone"
            }
        }
        maven {
            url = "https://repo.diogotc.com/releases"
            content {
                includeGroupAndSubgroups "com.rexcantor64"
            }
        }
        maven {
            url = "https://maven.nucleoid.xyz/"
            content {
                includeGroup "eu.pb4"
            }
        }
        maven {
            url = "https://repo.opencollab.dev/main/"
            content {
                includeGroupAndSubgroups "org.geysermc"
                includeGroupAndSubgroups "org.cloudburstmc"
            }
        }
        maven {
            url = "https://mvn-repo.arim.space/affero-gpl3/"
            content {
                includeGroupAndSubgroups "space.arim"
            }
        }
        maven {
            url = "https://mvn-repo.arim.space/lesser-gpl3/"
            content {
                includeGroupAndSubgroups "space.arim"
            }
        }
        maven {
            url = "https://maven.hytale.com/release"
            content {
                includeGroup "com.hypixel.hytale"
            }
        }
        maven {
            url = "https://maven.hytale.com/pre-release"
            content {
                includeGroup "com.hypixel.hytale"
            }
        }
        maven {
            url = "https://repo.spongepowered.org/repository/maven-public/"
            content {
                includeGroupAndSubgroups "org.spongepowered"
            }
        }
        maven {
            url = "https://repo.inventivetalent.org/repository/public/"
            content {
                includeGroup "org.mineskin"
            }
        }
        maven {
            url = "https://jitpack.io"
            content {
                includeGroupByRegex "com\\.github\\..*"
                includeGroupByRegex "com\\.gitlab\\..*"
            }
        }
        exclusiveContent {
            forRepository {
                maven { url = "https://api.modrinth.com/maven" }
            }
            filter {
                includeGroup "maven.modrinth"
            }
        }
        exclusiveContent {
            forRepository {
                maven { url = "https://www.cursemaven.com" }
            }
            filter {
                includeGroup "curse.maven"
            }
        }
    }

    dependencies {
        api "org.jspecify:jspecify:$jspecify_version"

        compileOnlyApi "org.projectlombok:lombok:$lombok_version"
        annotationProcessor "org.projectlombok:lombok:$lombok_version"
    }

    downgradeJar {
        quiet = true
        downgradeTo = JavaVersion.VERSION_21
    }

    tasks.register("buildFinalJar", Jar) {
        archiveFileName = "FlectonePulse-" + project.name + "-" + project_version + ".jar"
        destinationDirectory = file("$rootDir/build/libs")
    }

    shadowJar {
        relocate("com.zaxxer.hikari", "${relocated_pattern}.hikari")
        relocate("org.jdbi", "${relocated_pattern}.jdbi3")
        relocate("com.alessiodp.libby", "${relocated_pattern}.libby")
        relocate("spark.", "${relocated_pattern}.spark.")
        relocate("org.apache.commons", "${relocated_pattern}.apache")
        relocate("com.fasterxml.jackson", "${relocated_pattern}.jackson")
        relocate("tools.jackson", "${relocated_pattern}.jackson")
        relocate("org.snakeyaml.engine", "${relocated_pattern}.snakeyaml")
        relocate("io.lettuce", "${relocated_pattern}.lettuce")
        relocate("com.github.benmanes.caffeine", "${relocated_pattern}.caffeine")
        relocate("com.github.retrooper.packetevents", "${relocated_pattern}.packetevents")
        relocate("io.github.retrooper.packetevents", "${relocated_pattern}.packetevents.impl")
        relocate("org.incendo", "${relocated_pattern}.cloud")
        relocate("io.leangen.geantyref", "${relocated_pattern}.geantyref")
        relocate("org.mineskin", "${relocated_pattern}.mineskin")

        if (project.name != "minecraft-paper") {
            relocate("net.kyori", "${relocated_pattern}")
            relocate("com.google.gson", "${relocated_pattern}.gson")
        }

        if (project.name != "minecraft-velocity" && project.parent.name != "minecraft-velocity") {
            relocate("com.google.inject", "${relocated_pattern}.guice")
            relocate("com.google.common", "${relocated_pattern}.guava")
        }

        from(rootProject.file("LICENSE")) {
            into("/")
        }

        outputs.cacheIf { true }
    }

}

configure(project(":api")) {
    apply plugin: "com.github.gmazzo.buildconfig"
    apply plugin: "com.vanniktech.maven.publish"

    java {
        withSourcesJar()
    }

    buildConfig {
        className("BuildConfig")
        packageName(maven_group)
        rootProject.ext.properties.findAll { key, value -> !key.contains(".") }
                .each { key, value -> buildConfigField(String, key.toString().toUpperCase(), value) }
    }

    mavenPublishing {
        publishToMavenCentral(true)

        coordinates(maven_group, project.name, project_version)

        pom {
            name = "FlectonePulse API"
            description = "Every Message Under Your Control!"
            url = "https://github.com/Flectone/FlectonePulse"

            licenses {
                license {
                    name = "GNU General Public License v3.0"
                    url = "https://www.gnu.org/licenses/gpl-3.0"
                }
            }

            developers {
                developer {
                    id = "TheFaser"
                    name = "TheFaser"
                    email = "artem.mochalin11@gmail.com"
                }
            }

            scm {
                connection = "scm:git:https://github.com/Flectone/FlectonePulse.git"
                developerConnection = "scm:git:ssh://github.com/Flectone/FlectonePulse.git"
                url = "https://github.com/Flectone/FlectonePulse"
            }
        }

        signAllPublications()
    }

    afterEvaluate {
        publishing.publications.withType(MavenPublication).configureEach {
            pom.withXml {
                def dependenciesNode = asNode().dependencies?.getAt(0) ?: asNode().appendNode("dependencies")
                configurations.compileOnlyApi.allDependencies.each { dep ->
                    if (dep.group != null && dep.version != null) {
                        def depNode = dependenciesNode.appendNode("dependency")
                        depNode.appendNode("groupId", dep.group)
                        depNode.appendNode("artifactId", dep.name)
                        depNode.appendNode("version", dep.version)
                        depNode.appendNode("scope", "compile")
                        depNode.appendNode("optional", "true")
                    }
                }
            }
        }
    }
}