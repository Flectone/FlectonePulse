plugins {
    id "net.neoforged.moddev" version "${neoforge_moddev_version}"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(java_version)
    }
}

neoForge {
    version = "${neoforge_version}"
}

configurations.configureEach {
    exclude group: "com.github.retrooper", module: "adventure-text-serializer-gson"
    exclude group: "com.github.retrooper", module: "adventure-text-serializer-legacy"
    resolutionStrategy {
        force "org.jspecify:jspecify:1.0.1"
    }
}

configurations {
    shadow
    implementation.extendsFrom shadow
}

dependencies {
    components {
        withModule("org.apache.commons:commons-text") {
            allVariants {
                withDependencies {
                    removeAll { it.name == "commons-lang3" }
                }
            }
        }
    }

    shadow project(":common")
    shadow project(":minecraft-common")

    compileOnly project(":api")
    compileOnly project(":minecraft-neoforge:loader")

    compileOnly libraries.platform
    compileOnly libraries.adventure

    compileOnly "org.incendo:cloud-brigadier:${cloud_paper_version}"

    compileOnly "net.flectone:packeteventsmodern-api:$packeteventsmodern_version"
    compileOnly "net.flectone:packeteventsmodern-netty-common:$packeteventsmodern_version"
    compileOnly "net.flectone:packeteventsmodern-neoforge:$packeteventsmodern_version"
}

shadowJar {
    configurations = [project.configurations.shadow]
}

tasks.register("jarInJarContent", Jar) {
    archiveFileName = "flectonepulse-neoforge.jarinjar"

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    from { zipTree(project(":minecraft-neoforge").tasks.named("shadeDowngradedApi").get().archiveFile) }
    from { zipTree(project(":minecraft-neoforge:1.21.4").tasks.named("shadeDowngradedApi").get().archiveFile) }
    from { zipTree(project(":minecraft-neoforge:1.21.9").tasks.named("shadeDowngradedApi").get().archiveFile) }
    from { zipTree(project(":minecraft-neoforge:1.21.11").tasks.named("shadeDowngradedApi").get().archiveFile) }

    dependsOn(":minecraft-neoforge:shadeDowngradedApi")
    dependsOn(":minecraft-neoforge:1.21.4:shadeDowngradedApi")
    dependsOn(":minecraft-neoforge:1.21.9:shadeDowngradedApi")
    dependsOn(":minecraft-neoforge:1.21.11:shadeDowngradedApi")
}

tasks.named("buildFinalJar", Jar) {
    archiveFileName = "FlectonePulse-NeoForge-" + project_version + ".jar"

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    from { zipTree(project(":minecraft-neoforge:loader").tasks.named("shadeDowngradedApi").get().archiveFile) }

    dependsOn(":minecraft-neoforge:loader:shadeDowngradedApi")
}