plugins {
    id 'net.neoforged.moddev' version "${neoforge_moddev_version}"
}

neoForge {
    version = "${neoforge_version}"
}

configurations.configureEach {
    resolutionStrategy {
        force 'org.jspecify:jspecify:1.0.1'
        force 'it.unimi.dsi:fastutil:8.5.19'
        force 'commons-io:commons-io:2.22.0'
    }
}

shadowJar {
    archiveFileName = "flectonepulsedev-" + project.name + "-" + project_version + ".jar"
    configurations = []

    from {
        project(':minecraft-neoforge').tasks.shadowJar.archiveFile
    }

    dependsOn(':minecraft-neoforge:shadowJar')
}

processResources {
    def props = [version: "$project_version", author: "$project_author", description: "$project_description"]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('**/META-INF/neoforge.mods.toml') {
        expand props
    }
}

artifacts {
    archives shadowJar
}