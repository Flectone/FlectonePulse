plugins {
    id "net.neoforged.moddev" version "${neoforge_moddev_version}"
}

neoForge {
    version = "${neoforge_version}"
}

configurations.configureEach {
    resolutionStrategy {
        force "org.jspecify:jspecify:1.0.1"
    }
}

configurations {
    shade
}

dependencies {
    shade project(":api")
    implementation project(":api")

    compileOnly "de.maxhenkel.voicechat:voicechat-api:$voicechatapi_version"
}

shadowJar {
    configurations = [project.configurations.shade]

    exclude("org/jspecify/**")

    from { project(":minecraft-neoforge").tasks.shadowJar.archiveFile }
    dependsOn(":minecraft-neoforge:shadowJar")
}

processResources {
    def props = [version: "$project_version", author: "$project_author", description: "$project_description"]
    inputs.properties props
    filteringCharset "UTF-8"
    filesMatching("**/META-INF/neoforge.mods.toml") { expand props }
}