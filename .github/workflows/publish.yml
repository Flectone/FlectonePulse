name: Publish to Github and Maven central

on:
  push:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6

      - name: Change wrapper permissions
        run: chmod +x ./gradlew

      - name: Build minecraft-bukkit
        run: ./gradlew :minecraft-bukkit:buildFinalJar

      - name: Build minecraft-fabric
        run: ./gradlew :minecraft-fabric:buildFinalJar

      - name: Build minecraft-neoforge
        run: ./gradlew :minecraft-neoforge:buildFinalJar

      - name: Build minecraft-sponge
        run: ./gradlew :minecraft-sponge:buildFinalJar

      - name: Build hytale
        run: ./gradlew :hytale:buildFinalJar

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: FlectonePulse
          path: build/libs
          if-no-files-found: warn
          retention-days: 14

  publish-maven:
    name: Publish to Maven Central
    needs: build
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      is_release: ${{ steps.version.outputs.is_release }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6

      - name: Resolve project version
        id: version
        run: |
          VERSION=$(grep '^project_version' gradle.properties | cut -d= -f2 | tr -d ' ')
          echo "Resolved version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *SNAPSHOT* ]]; then
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Change wrapper permissions
        run: chmod +x ./gradlew

      - name: Publish to Maven Central
        run: ./gradlew publishToMavenCentral --no-daemon
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_IN_MEMORY_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}

  release:
    name: Create GitHub Release
    needs: [build, publish-maven]
    if: needs.publish-maven.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download all built jars
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: FlectonePulse
          path: build/libs

      - name: Create release and attach jars
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: v${{ needs.publish-maven.outputs.version }}
          name: v${{ needs.publish-maven.outputs.version }}
          files: build/libs/**/*.jar
          generate_release_notes: true