dependencies {
    implementation project(":api")

    compileOnly "com.hypixel.hytale:Server:$hytale_server_version"
}

shadowJar {
    from { project(":hytale").tasks.shadowJar.archiveFile }

    dependsOn(":hytale:shadowJar")
}

processResources {
    def props = [version: "$project_version", author: "$project_author", description: "$project_description"]
    inputs.properties props
    filteringCharset "UTF-8"
    filesMatching("**/manifest.json") { expand props }
}