dependencies {
    implementation project(module_common)

    compileOnly project("$module_hytale:$module_loader")
    compileOnly project(module_api)

    compileOnly libraries.platform
    compileOnly libraries.adventure

    compileOnly "eu.mikart.adventure:adventure-platform-hytale:$adventure_platform_hytale_version"
    compileOnly "com.hypixel.hytale:Server:$hytale_server_version"
    compileOnly "at.helpch:placeholderapi-hytale:$placeholderapi_hytale_version"
}

shadowJar {
    archiveFileName = "flectonepulse-hytale.jarinjar"
}

tasks.named("buildFinalJar", Jar) {
    archiveFileName = "FlectonePulse-Hytale-${project_version}.jar"

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    from { zipTree(project("$module_hytale:$module_loader").tasks.shadowJar.archiveFile) }

    dependsOn("$module_hytale:$module_loader:shadowJar")
}
