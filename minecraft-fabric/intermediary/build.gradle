plugins {
	id "net.fabricmc.fabric-loom-remap"
}

def versions = ["1.14", "1.16", "1.17", "1.19", "1.19.3", "1.19.4", "1.20.2", "1.20.5", "1.21.2", "1.21.4", "1.21.5", "1.21.9", "1.21.11"]
def accessWidener = file("loader/src/main/resources/flectonepulse.accesswidener")

loom {
	accessWidenerPath = accessWidener
}

dependencies {
	minecraft("com.mojang:minecraft:${fabric_minecraft_version}")
	mappings(loom.officialMojangMappings())

	compileOnly project(":common")
	compileOnly project(":minecraft-common")

	compileOnly project(":api")
	compileOnly project(path: ":minecraft-fabric:intermediary:loader", configuration: "namedElements")

	compileOnly libraries.platform
	compileOnly libraries.adventure

	modCompileOnly "net.fabricmc:fabric-loader:${fabric_loader_version}"

	modCompileOnly fabricApi.module("fabric-api-base", fabric_api_version)
	modCompileOnly fabricApi.module("fabric-lifecycle-events-v1", fabric_api_version)
	modCompileOnly fabricApi.module("fabric-networking-api-v1", fabric_api_version)

	compileOnly "org.incendo:cloud-brigadier:${cloud_paper_version}"

	compileOnly "net.flectone:packeteventsmodern-api:$packeteventsmodern_version"
	compileOnly "net.flectone:packeteventsmodern-netty-common:$packeteventsmodern_version"
	compileOnly "net.flectone:packeteventsmodern-fabric-common:$packeteventsmodern_version"

	// integrations
	modCompileOnly "eu.pb4:placeholder-api:$text_placeholder_api_version"
	modCompileOnly "maven.modrinth:vanish:$vanish_version"
	compileOnly "io.github.miniplaceholders:miniplaceholders-api:$miniplaceholders_api_version"
}

compileJava {
	source("../official/src/main/java")
}

shadowJar {
	configurations = []
}

remapJar {
	inputFile = shadowJar.archiveFile
	dependsOn(shadowJar)
}

downgradeJar {
	inputFile = remapJar.archiveFile
}

tasks.register("jarInJarContent", Jar) {
	archiveFileName = "flectonepulse-fabric-platform.jarinjar"

	duplicatesStrategy = DuplicatesStrategy.EXCLUDE

	from { zipTree(tasks.named("shadeDowngradedApi").get().archiveFile) }
	dependsOn("shadeDowngradedApi")

	versions.each { version ->
		from { zipTree(project(":minecraft-fabric:intermediary:${version}").tasks.named("shadeDowngradedApi").get().archiveFile) }
		dependsOn(":minecraft-fabric:intermediary:${version}:shadeDowngradedApi")
	}
}

configure(versions.collect { project(":minecraft-fabric:intermediary:${it}") }) {
	apply plugin: "net.fabricmc.fabric-loom-remap"

	loom {
		accessWidenerPath = accessWidener
	}

	dependencies {
		minecraft("com.mojang:minecraft:${fabric_minecraft_version}")
		mappings(loom.officialMojangMappings())

		compileOnly project(path: ":minecraft-fabric:intermediary", configuration: "namedElements")
		versions.subList(0, versions.indexOf(project.name)).each { version ->
			compileOnly project(path: ":minecraft-fabric:intermediary:${version}", configuration: "namedElements")
		}

		compileOnly project(":api")

		compileOnly "com.google.inject:guice:$guice_version"
		compileOnly "net.flectone:packeteventsmodern-api:$packeteventsmodern_version"
	}

	shadowJar {
		configurations = []
	}

	remapJar {
		inputFile = shadowJar.archiveFile
		dependsOn(shadowJar)
	}

	downgradeJar {
		inputFile = remapJar.archiveFile
	}
}
