plugins {
	id "net.fabricmc.fabric-loom" version "$fabric_loom_version" apply false
}

tasks.named("buildFinalJar", Jar) {
	archiveFileName = "$project_name-Fabric-${project_version}.jar"

	duplicatesStrategy = DuplicatesStrategy.EXCLUDE

	def props = [version: "$project_version", description: "$project_description"]
	inputs.properties props

	from("fabric.mod.json") {
		filteringCharset "UTF-8"
		expand props
	}

	from("official/loader/src/main/resources") {
		include "assets/**"
	}

	from { zipTree(project(":api").tasks.named("shadeDowngradedApi").get().archiveFile) }

	from({ project(":minecraft-common").tasks.named("shadeDowngradedApi").get().archiveFile }) {
		rename { "$project_mod_id-fabric.jarinjar" }
	}

	into("META-INF/jars") {
		from { project(":minecraft-fabric:intermediary:loader").tasks.named("shadeDowngradedApi").get().archiveFile }
		rename { "$project_mod_id-intermediary.jar" }
	}

	into("META-INF/jars") {
		from { project(":minecraft-fabric:official:loader").tasks.named("shadeDowngradedApi").get().archiveFile }
		rename { "$project_mod_id-official.jar" }
	}

	dependsOn(":api:shadeDowngradedApi")
	dependsOn(":minecraft-common:shadeDowngradedApi")
	dependsOn(":minecraft-fabric:intermediary:loader:shadeDowngradedApi")
	dependsOn(":minecraft-fabric:official:loader:shadeDowngradedApi")
}
