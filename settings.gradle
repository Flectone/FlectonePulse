pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
    }
}

include "api"
include "common"
include "hytale"
include 'hytale:loader'
include "minecraft-common"
include "minecraft-fabric"
include 'minecraft-fabric:loader'
include "minecraft-bukkit"
include 'minecraft-bukkit:loader'
include "minecraft-paper"
include "minecraft-velocity"
include "minecraft-velocity:loader"
include "minecraft-bungeecord"
include "minecraft-bungeecord:loader"
include "minecraft-neoforge"
include "minecraft-neoforge:loader"