configurations {
    shade
}

dependencies {
    shade project(":api")
    implementation project(":api")

    compileOnly "org.spongepowered:spongeapi:${spongeapi_version}"
}

shadowJar {
    configurations = [project.configurations.shade]

    exclude("org/jspecify/**")

    from { project(":minecraft-sponge").tasks.named("jarInJarContent").get().archiveFile }
    dependsOn(":minecraft-sponge:jarInJarContent")
}

processResources {
    def props = [version: "$project_version", author: "$project_author", description: "$project_description"]
    inputs.properties props
    filteringCharset "UTF-8"
    filesMatching("META-INF/sponge_plugins.json") { expand props }
}
